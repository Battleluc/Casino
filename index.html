}
const stick=$('stick'),nub=$('nub');
function joystick(e){const r=stick.getBoundingClientRect(),max=r.width*.31;let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),len=Math.hypot(dx,dy);if(len>max){dx*=max/len;dy*=max/len}moveX=dx/max;moveY=dy/max;nub.style.transform=`translate(${dx}px,${dy}px)`}
function resetJoy(){joyId=null;moveX=moveY=0;nub.style.transform='translate(0,0)'}
stick.addEventListener('pointerdown',e=>{e.preventDefault();joyId=e.pointerId;try{stick.setPointerCapture(e.pointerId)}catch(_){}joystick(e)});
stick.addEventListener('pointermove',e=>{if(e.pointerId===joyId){e.preventDefault();joystick(e)}});
stick.addEventListener('pointerup',e=>{if(e.pointerId===joyId)resetJoy()});stick.addEventListener('pointercancel',resetJoy);stick.addEventListener('lostpointercapture',resetJoy);window.addEventListener('blur',resetJoy);
window.addEventListener('keydown',e=>{keys[e.key]=true});window.addEventListener('keyup',e=>{keys[e.key]=false});
// Right-side swipe rotates only the camera. Character remains still unless joystick is used.
function overControl(el){return !!(el&&el.closest&&el.closest('button,.stick,.games,.leftmenu,.rightControls,#modal'))}
window.addEventListener('pointerdown',e=>{
 if(e.pointerType==='mouse'&&e.button!==0)return;
 if(e.clientX<innerWidth*.42||overControl(e.target))return;

},{passive:true});
window.addEventListener('pointermove',e=>{

 const dx=e.clientX-lastCamX,dy=e.clientY-lastCamY;lastCamX=e.clientX;lastCamY=e.clientY;

},{passive:true});
function endCameraTouch(e){if(cameraTouch===e.pointerId)cameraTouch=null}

function renderGame(id){const s=$('screen');if(id==='slots'){s.innerHTML='<div class="big" id="reels">🍒 ⭐ 💎</div><div class="res" id="res">Aligne les symboles !</div><button class="btn gold" id="play">LANCER · 50 🪙</button>';byId('play').onclick=()=>{if(!bet())return;const a=['🍒','⭐','💎','7️⃣','🔔','🍀'];const r=[pick(a),pick(a),pick(a)];byId('reels').textContent=r.join(' ');const n=r[0]===r[1]&&r[1]===r[2]?500:(r[0]===r[1]||r[1]===r[2]||r[0]===r[2]?100:0);if(n)win(n);byId('res').textContent=n?'Gagné : +'+n+' jetons !':'Pas cette fois !'}}
 else if(id==='blackjack'){let total=0;s.innerHTML='<div class="big">🂡 ♥️ ♠️</div><div class="res" id="res">Tire des cartes sans dépasser 21.</div><div><button class="btn gold" id="draw">TIRER · 50 🪙</button> <button class="btn" id="stay">RESTER</button></div><div id="total">Total : 0</div>';byId('draw').onclick=()=>{if(!bet())return;total+=1+Math.random()*11|0;byId('total').textContent='Total : '+total;if(total>21){byId('res').textContent='Dépassé ! Nouvelle main.';total=0;byId('total').textContent='Total : 0'}else if(total===21){win(250);byId('res').textContent='21 parfait ! +250';total=0;byId('total').textContent='Total : 0'}};byId('stay').onclick=()=>{if(total>=15){win(100);byId('res').textContent='Bien joué, +100 !'}else byId('res').textContent='Le croupier gagne.';total=0;byId('total').textContent='Total : 0'}}
 else if(id==='roulette'){s.innerHTML='<div class="big">🎡</div><div class="res" id="res">Choisis une couleur.</div><button class="btn gold" id="red">🔴 ROUGE</button> <button class="btn" id="black">⚫ NOIR</button>';const go=c=>{if(!bet())return;if(Math.random()<.47){win(100);byId('res').textContent='Gagné : +100 !'}else byId('res').textContent='Raté !';};byId('red').onclick=()=>go('rouge');byId('black').onclick=()=>go('noir')}
 else if(id==='dice'){s.innerHTML='<div class="big" id="dice">🎲 🎲</div><div class="res" id="res">Double = gros gain !</div><button class="btn gold" id="play">LANCER LES DÉS · 50</button>';byId('play').onclick=()=>{if(!bet())return;let a=1+Math.random()*6|0,b=1+Math.random()*6|0;byId('dice').textContent=`${a} 🎲 ${b}`;if(a===b){win(250);byId('res').textContent='Double ! +250'}else if(a+b>=9){win(100);byId('res').textContent='Bien joué ! +100'}else byId('res').textContent='Perdu, retente !'}}
 else if(id==='wheel'){s.innerHTML='<div class="big" id="wheel">🎯</div><div class="res" id="res">Fais tourner la roue.</div><button class="btn gold" id="play">TOURNER · 50</button>';byId('play').onclick=()=>{if(!bet())return;const v=[0,50,100,200,500][Math.random()*5|0];byId('wheel').textContent=['✨','💎','⭐','🎁','👑'][[0,50,100,200,500].indexOf(v)];if(v)win(v);byId('res').textContent=v?'Gagné : +'+v:'Rien cette fois !'}}
 else{s.innerHTML='<div class="big" id="scr">❔ ❔ ❔</div><div class="res" id="res">Trouve des symboles identiques.</div><button class="btn gold" id="play">GRATTER · 50</button>';byId('play').onclick=()=>{if(!bet())return;const a=['🍀','💎','🌙','⭐','🍒'],r=[pick(a),pick(a),pick(a)];byId('scr').textContent=r.join(' ');if(r[0]===r[1]||r[1]===r[2]||r[0]===r[2]){win(150);byId('res').textContent='Combo ! +150'}else byId('res').textContent='Pas de combo !'}}
}
function byId(id){return document.getElementById(id)}function pick(a){return a[Math.random()*a.length|0]}function bet(){if(coins<50){toast('Pas assez de jetons !');return false}coins-=50;updateMoney();return true}function win(n){coins+=n;updateMoney()}
